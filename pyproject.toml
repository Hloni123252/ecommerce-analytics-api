[project]
name = "ecommerce-analytics-api"
version = "0.1.0"
description = "E-commerce analytics platform with FastAPI, Celery, Redis, and ML"
authors = [
    {name = "Lehlohonolo Mtshizana",email = "lehlohonolomtshizana@icloud.com"}
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.53.0,<0.54.0)",
    "sqlalchemy (>=2.0.54,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "faker (>=40.39.0,<41.0.0)",
    "numpy (>=2.5.3,<3.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

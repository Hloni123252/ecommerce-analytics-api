version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ecom_db
    environment:
      POSTGRES_USER: ecomuser
      POSTGRES_PASSWORD: ecompass
      POSTGRES_DB: ecomdb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ecom_redis
    ports:
      - "6380:6379"

volumes:
  postgres_data:
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx pytest-asyncio

      - name: Verify app imports
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test_ci.db"
          SECRET_KEY: "ci-test-secret-key"
        run: |
          python -c "from app.main import app; print('✅ App imports OK')"

      - name: Start server and check health
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test_ci.db"
          SECRET_KEY: "ci-test-secret-key"
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8001 &
          SERVER_PID=$!
          sleep 8
          curl -f http://localhost:8001/health || (kill $SERVER_PID; exit 1)
          kill $SERVER_PID